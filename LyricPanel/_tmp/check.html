<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lyric Panel preview</title></head>
<body>
<script>
  // Browser-only preview with fake Premiere/Node, for checking syntax and layout.
  window.__errors = [];
  window.onerror = function (m, s, l, c) { window.__errors.push(m + ' @' + l + ':' + c); };
  window.addEventListener('unhandledrejection', function (e) { window.__errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)); });
  var DEV = 'C:/dev', files = {};
  files['C:/appdata/LyricPanel/Rock Tunes_1.json'] = JSON.stringify({ font: 'Arial', size: 115, caps: true, maxWidth: 72 }); // remove to preview a channel that is not set up
  files['C:/songs/No Srt Yet - Demo/lyrics.txt'] = 'some words here';
  var SONGS = ['2WEI & Edda Hayes - Burn', 'Cults - Gilded Lily', "Isabel LaRosa - I'm yours (sped up)", 'Kodaline - The One', 'No Srt Yet - Demo', 'Two Audio - Demo', ];
  var srt = '1\n00:00:08,383 --> 00:00:16,057\nfirst row\nsecond row\n\n2\n00:00:17,000 --> 00:00:20,000\nanother\n';
  var fakeFs = {
    existsSync: function (p) { return files[p] !== undefined || p.indexOf('Loose') < 0; }, mkdirSync: function (p) { SONGS.push(p.split('/').pop()); }, appendFileSync: function () {}, unlinkSync: function () {},
    renameSync: function (a, b) { var i = SONGS.indexOf(a.split('/').pop()); if (i >= 0) SONGS.splice(i, 1); },
    writeFileSync: function (p, d) { files[p] = d; }, copyFileSync: function () {},
    readFileSync: function (p) { if (files[p] !== undefined) return files[p]; if (/\.srt$/.test(p)) return srt; throw new Error('ENOENT ' + p); },
    statSync: function (p) { return { isDirectory: function () { return !/[.]mp3$/.test(p); } }; },
    readdirSync: function (p) {
      if (p === 'C:/songs') return SONGS;
      var n = p.split('/').pop();
      if (n === 'No Srt Yet - Demo') return [n + '.mp3', 'lyrics.txt'];
      if (n === 'Two Audio - Demo') return ['a.mp3', 'b.mp3'];
      return [n + '.mp3', n + '.srt', 'song.mp3', 'vocals.wav', 'lyrics.txt'];
    }
  };
  var mods = {
    fs: fakeFs,
    path: { join: function () { return Array.prototype.join.call(arguments, '/'); }, basename: function (p) { return p.split('/').pop(); } },
    child_process: { spawn: function (c, args) {
        var h = {}, p = { stdout: { on: function () {} }, stderr: { on: function (e, f) { h.data = f; } }, on: function (e, f) { h[e] = f; } };
        var k = 0, t = setInterval(function () { k += 25; if (args[1] === 'demucs') h.data(' ' + k + '%|###   | 1/2 [00:01<00:01]'); if (k >= 100) { clearInterval(t); window.__spawned = (window.__spawned || 0) + 1; h.close(0); } }, 300);
        return p;
      }, execFile: function (c, a, o, cb) { setTimeout(function () { cb(null, '    Arial (TrueType)    REG_SZ    arial.ttf\r\n    DK Midnight Chalker (TrueType)    REG_SZ    x.ttf\r\n', ''); }, 10); } }
  };
  function req(n) { return mods[n]; }
  window.process = { env: { APPDATA: 'C:/appdata' } };
  window.cep = { fs: { showOpenDialogEx: function () { return { err: 0, data: ['C:\\songs'] }; } } };
  window.__adobe_cep__ = {
    evalScript: function (script, cb) {
      var m = /lpRun\("(\w+)","([^"]+)","([^"]+)"\)/.exec(script), data = {};
      if (m[1] === 'info') data = { version: '23.3.0', project: 'Rock Tunes_1.prproj', sequences: [{ name: 'Lyrics', id: 'a', w: 1920, h: 1080, timebase: '10594584000', v: 5, a: 1 }, { name: 'Rock Tunes', id: 'b', w: 1920, h: 1080, timebase: '10594584000', v: 3, a: 3 }], bins: [{ name: 'Assets', items: 5 }, { name: 'Backgrounds', items: 24 }] };
      if (m[1] === 'binItems') data = { found: true, items: new Array(24).fill(0).map(function (x, i) { return { name: (i + 1) + '.jpg', path: 'C:/bg/' + (i + 1) + '.jpg' }; }) };
      files[m[3]] = JSON.stringify({ ok: true, data: data });
      setTimeout(function () { cb('ok'); }, 5);
    }
  };
</script>
<script src="../js/main.js"></script>
</body>
</html>
